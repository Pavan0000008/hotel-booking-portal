<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Login</title>

<style>
* { box-sizing: border-box; font-family: Arial; }

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #3e2f25, #6b4f3f);
}

.container {
    width: 350px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    outline: none;
}

.error {
    color: #ffb3b3;
    font-size: 12px;
    display: none;
}

input.invalid {
    border: 2px solid red;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<form onsubmit="return validateForm()">

<label>Email or Phone</label>
<input type="text" id="email">
<div class="error" id="emailError"></div>

<label>Password</label>
<input type="password" id="password">
<div class="error" id="passError"></div>

<button>Login</button>

</form>

</div>

<script>
function validateForm() {

    let email = document.getElementById("email");
    let pass = document.getElementById("password");

    let emailVal = email.value.trim();
    let passVal = pass.value.trim();

    let valid = true;

    // Reset
    document.getElementById("emailError").style.display = "none";
    document.getElementById("passError").style.display = "none";
    email.classList.remove("invalid");
    pass.classList.remove("invalid");

    // Email or Phone validation
    let emailRegex = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    let phoneRegex = /^[0-9]{10}$/;

    if (!emailRegex.test(emailVal) && !phoneRegex.test(emailVal)) {
        document.getElementById("emailError").innerText = "Enter valid Email or 10-digit phone";
        document.getElementById("emailError").style.display = "block";
        email.classList.add("invalid");
        valid = false;
    }

    // Password validation
    let strongPass = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[\W]).{8,}$/;

    if (!strongPass.test(passVal)) {
        document.getElementById("passError").innerText =
            "Password must be 8+ chars, include uppercase, number & symbol";
        document.getElementById("passError").style.display = "block";
        pass.classList.add("invalid");
        valid = false;
    }

    return valid;
}
</script>

</body>
</html>

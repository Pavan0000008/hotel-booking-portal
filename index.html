<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #3e2f25, #6b4f3f);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass effect container */
.container {
    width: 350px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    color: white;
}

.logo img {
    width: 60px;
    margin-bottom: 10px;
}

h2 {
    margin-bottom: 20px;
}

/* Input group */
.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 12px 40px;
    border: none;
    border-radius: 8px;
    outline: none;
}

.input-group span {
    position: absolute;
    left: 10px;
    top: 12px;
    color: #555;
}

/* Password toggle */
.toggle {
    position: absolute;
    right: 10px;
    top: 12px;
    cursor: pointer;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #fff;
    color: #3e2f25;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ddd;
}

.links {
    margin-top: 15px;
}

.links a {
    color: #ddd;
    font-size: 13px;
    text-decoration: none;
}

/* Responsive */
@media(max-width: 400px){
    .container {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/139/139899.png">
    </div>

    <h2>Login</h2>

    <form onsubmit="return validateForm()">

        <div class="input-group">
            <span>📧</span>
            <input type="text" id="email" placeholder="Email or Phone">
        </div>

        <div class="input-group">
            <span>🔒</span>
            <input type="password" id="password" placeholder="Password">
            <span class="toggle" onclick="togglePassword()">👁️</span>
        </div>

        <button id="loginBtn">Login</button>

    </form>

    <div class="links">
        <a href="#">Forgot Password?</a><br>
        <a href="#">Create Account</a>
    </div>

</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function validateForm() {
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    if(email === "" || pass === ""){
        alert("All fields required!");
        return false;
    }

    if(pass.length < 6){
        alert("Password must be at least 6 characters");
        return false;
    }

    // fake loading effect
    let btn = document.getElementById("loginBtn");
    btn.innerText = "Logging in...";
    
    setTimeout(() => {
        alert("Login Successful (Demo)");
        btn.innerText = "Login";
    }, 1500);

    return false; // stop actual submit (demo)
}
</script>

</body>
</html>
